<title>全球资产日报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.6;
    padding-bottom: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* 卡片列表 */
  .card-list {
    padding: 12px;
  }

  /* 日报卡片 */
  .daily-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .daily-card:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* 卡片顶部 */
  .card-header {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 10px;
  }
  .card-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
    flex: 1;
  }
  .card-date {
    font-size: 12px;
    color: #94a3b8;
    flex-shrink: 0;
  }

  /* 卡片配图 - 16:6 比例 */
  .card-image {
    width: 100%;
    aspect-ratio: 16/6;
    position: relative;
    overflow: hidden;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-image-placeholder {
    width: 100%;
    height: 100%;
  }
  .card-image-1 {
    background: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 50%, #06b6d4 100%);
  }
  .card-image-2 {
    background: linear-gradient(135deg, #1e293b 0%, #8b5cf6 50%, #ec4899 100%);
  }
  .card-image-3 {
    background: linear-gradient(135deg, #0f172a 0%, #f59e0b 50%, #ef4444 100%);
  }

  /* 卡片底部3行要点 */
  .card-points {
    padding: 10px 14px 14px;
  }
  .point-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    line-height: 2;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .point-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 16px;
    color: #94a3b8;
    font-size: 10px;
  }

  /* 大屏适配 */
  @media (min-width: 600px) {
    body { padding: 0 20px 20px; }
    .card-list {
      max-width: 600px;
      margin: 0 auto;
    }
  }
</style>
</head>
