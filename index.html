<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全球资产日报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.6;
    padding-bottom: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* 卡片列表 */
  .card-list {
    padding: 12px;
  }

  /* 日报卡片 */
  .daily-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .daily-card:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* 卡片顶部 */
  .card-header {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 10px;
  }
  .card-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
    flex: 1;
  }
  .card-date {
    font-size: 12px;
    color: #94a3b8;
    flex-shrink: 0;
  }

  /* 卡片配图 - 16:6 比例 */
  .card-image {
    width: 100%;
    aspect-ratio: 16/6;
    position: relative;
    overflow: hidden;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-image-placeholder {
    width: 100%;
    height: 100%;
  }
  .card-image-1 {
    background: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 50%, #06b6d4 100%);
  }
  .card-image-2 {
    background: linear-gradient(135deg, #1e293b 0%, #8b5cf6 50%, #ec4899 100%);
  }
  .card-image-3 {
    background: linear-gradient(135deg, #0f172a 0%, #f59e0b 50%, #ef4444 100%);
  }

  /* 卡片底部摘要 */
  .card-summary {
    padding: 12px 14px 14px;
    font-size: 14px;
    color: #1e293b;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 16px;
    color: #94a3b8;
    font-size: 10px;
  }
  /* 没有了提示 */
  .no-more {
    text-align: center;
    padding: 20px;
    color: #94a3b8;
    font-size: 12px;
    display: none;
  }
  .no-more.show {
    display: block;
  }

  /* 大屏适配 */
  @media (min-width: 600px) {
    body { padding: 0 20px 20px; }
    .card-list {
      max-width: 600px;
      margin: 0 auto;
    }
  }
</style>
</head>

<div class="no-more" id="noMore">没有了</div>
<script>
  var noMore = document.getElementById('noMore');
  var hasShown = false;
  window.addEventListener('scroll', function() {
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    var windowHeight = window.innerHeight;
    var docHeight = document.documentElement.scrollHeight;
    if (scrollTop + windowHeight >= docHeight - 50) {
      if (!hasShown) {
        noMore.classList.add('show');
        hasShown = true;
      }
    }
  });
</script>
